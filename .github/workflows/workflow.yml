name: Run VK Stock Bot

on:
  schedule:
    # Запуск каждые 30 минут (время в UTC, то есть по Гринвичу)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Позволяет запускать бота вручную кнопкой

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot script
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }} # Передача токена
        run: python bot.py
