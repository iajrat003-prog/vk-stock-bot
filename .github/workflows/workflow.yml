name: Run VK Stock Bot

on:
  schedule:
    # Запуск каждые 30 минут
    - cron: '*/30 * * * *'
  workflow_dispatch: # Позволяет запускать вручную

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 1 # ЖЕСТКИЙ ЛИМИТ: GitHub убьет процесс через 1 минуту, даже если он зависнет
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Bot
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
        # Ставим библиотеки и запускаем скрипт в одну строчку
        run: |
          pip install requests feedparser
          python bot.py
          exit 0
