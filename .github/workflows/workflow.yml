name: Run VK Stock Bot

on:
  schedule:
    # Запуск каждые 30 минут
    - cron: '*/30 * * * *'
  workflow_dispatch: # Позволяет запускать бота вручную

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 2 # <-- ГАРАНТИЯ, ЧТО БОТ НЕ БУДЕТ ВИСЕТЬ ДОЛЬШЕ 2 МИНУТ
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot script
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
        run: python bot.py
